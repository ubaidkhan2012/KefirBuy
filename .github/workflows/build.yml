          .opt {
            min-width: 52px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--border);
            background: var(--cream); font-weight: 700; font-size: 13px;
          }
          .opt.on { border-color: var(--green); background: var(--sage); color: var(--green-dark); }
          .qty { display: inline-flex; align-items: center; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; }
          .qty button { width: 38px; height: 36px; display: grid; place-items: center; color: var(--green); }
          .qty button:disabled { color: var(--border); }
          .qty span { min-width: 34px; text-align: center; font-weight: 800; }
