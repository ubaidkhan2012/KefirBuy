            views.categories = function () {
              var page = el('<div class="page"><div class="topbar"><h1>Categories</h1><a class="icon-btn" href="#/search">' + icon('search') + '</a></div>' +
                '<div class="cat-layout"><div class="cat-rail"></div><div class="cat-panel">' + skeletonGrid(4) + '</div></div></div>');
              var rail = page.querySelector('.cat-rail');
              var panel = page.querySelector('.cat-panel');
              function show(c) {
                rail.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-id') === String(c.id)); });
                panel.innerHTML = '<div class="cat-banner"><b>' + text(c.name) + '</b><a href="#/c/' + c.id + '">View all</a></div>';
                var subs = (cats || []).filter(function (s) { return s.parent === c.id; });
