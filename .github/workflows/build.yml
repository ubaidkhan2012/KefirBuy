          .summary .line.save { color: #15803d; font-weight: 700; }
          .coupon { display: flex; gap: 8px; margin-top: 12px; }
          .coupon input { flex: 1; height: 44px; border-radius: 12px; border: 1.5px solid var(--border); padding: 0 12px; background: var(--cream); outline: none; text-transform: uppercase; }
          .coupon input:focus { border-color: var(--green); }
