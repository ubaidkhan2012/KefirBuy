      - name: Create the Android project
        run: |
          npm ci
          npx cap add android
          rm -f android/app/src/main/res/drawable-*/splash.png
          cp -r overlay/res/drawable overlay/res/mipmap-* android/app/src/main/res/
          cp overlay/res/values_ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          cp overlay/app.build.gradle android/app/build.gradle
          cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEY_PW=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the permanent KefirBuy key: installs over earlier permanent-key versions." >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias kefirbuy -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=KefirBuy, O=KefirBuy by Nature Hut, L=Peshawar, C=PK"
            echo "KEY_PW=$PW" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with a temporary key: uninstall any older KefirBuy app before installing." >> "$GITHUB_ENV"
          fi

      - name: Build the APK and App Bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_ALIAS: kefirbuy
        run: |
          export KEYSTORE_PASSWORD="$KEY_PW" KEY_PASSWORD="$KEY_PW"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/KefirBuy.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/KefirBuy.aab"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.9.0-build${{ github.run_number }}" KefirBuy.apk KefirBuy.aab \
            --repo "${{ github.repository }}" \
