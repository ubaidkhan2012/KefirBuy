          </adaptive-icon>
          END_OF_FILE_7
          cat > app/src/main/java/com/kefirbuy/app/MainActivity.java <<'END_OF_FILE_8'
          package com.kefirbuy.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends Activity {

              private static final String HOME = "https://kefirbuy.com/";
              private static final String SITE_HOST = "kefirbuy.com";
              private static final int FILE_REQUEST = 1001;
              private static final long SPLASH_MAX_MS = 8000;

              // KefirBuy brand palette
              private static final int DEEP_SAGE_GREEN = Color.parseColor("#38593B");
              private static final int DARK_GREEN = Color.parseColor("#2C472F");
              private static final int SOFT_SAGE = Color.parseColor("#DFE8D7");
              private static final int CREAM = Color.parseColor("#FDFBF7");
              private static final int WARM_AMBER = Color.parseColor("#D97706");
              private static final int AMBER_HOVER = Color.parseColor("#B45F04");
              private static final int SLATE_INK = Color.parseColor("#1E293B");
              private static final int MUTED_SLATE = Color.parseColor("#64748B");

              // Links to these sites open in their own apps (WhatsApp, Facebook, ...)
              private static final String[] EXTERNAL_HOSTS = {
                      "wa.me", "whatsapp.com", "facebook.com", "fb.com", "fb.me", "m.me",
                      "instagram.com", "youtube.com", "youtu.be", "tiktok.com",
                      "twitter.com", "x.com", "t.me", "linkedin.com", "pinterest.com",
                      "play.google.com", "maps.google.com", "maps.app.goo.gl", "goo.gl"
              };

              private WebView web;
              private SwipeRefreshLayout swipe;
              private ProgressBar bar;
              private LinearLayout offline;
              private FrameLayout splash;
              private ValueCallback<Uri[]> fileCallback;
              private boolean pageFailed = false;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(CREAM);

                  swipe = new SwipeRefreshLayout(this);
                  swipe.setColorSchemeColors(DEEP_SAGE_GREEN, WARM_AMBER);
                  swipe.setProgressBackgroundColorSchemeColor(CREAM);
                  web = new WebView(this);
                  web.setBackgroundColor(CREAM);
                  swipe.addView(web, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(swipe, matchParent());

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);
                  bar.setProgressTintList(ColorStateList.valueOf(WARM_AMBER));
                  bar.setProgressBackgroundTintList(ColorStateList.valueOf(SOFT_SAGE));
                  root.addView(bar, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, dp(4), Gravity.TOP));

                  offline = buildOfflineView();
                  offline.setVisibility(View.GONE);
                  root.addView(offline, matchParent());

                  splash = buildSplashView();
                  root.addView(splash, matchParent());

                  setContentView(root);
                  setupWebView();

                  swipe.setOnChildScrollUpCallback((parent, child) -> web.getScrollY() > 0);
                  swipe.setOnRefreshListener(() -> web.reload());

                  if (savedInstanceState != null) {
                      splash.setVisibility(View.GONE);
                      web.restoreState(savedInstanceState);
                  } else {
                      handler.postDelayed(this::hideSplash, SPLASH_MAX_MS);
                      Uri data = getIntent() != null ? getIntent().getData() : null;
                      web.loadUrl(data != null ? data.toString() : HOME);
                  }
              }

              private FrameLayout.LayoutParams matchParent() {
                  return new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT);
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(s.getUserAgentString() + " KefirBuyApp/1.0");

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          pageFailed = false;
                          bar.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          bar.setVisibility(View.GONE);
                          swipe.setRefreshing(false);
                          showOffline(pageFailed);
                          hideSplash();
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              pageFailed = true;
                              showOffline(true);
                              hideSplash();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          bar.setProgress(progress);
                          bar.setVisibility(progress < 100 ? View.VISIBLE : View.GONE);
                          if (progress >= 80) {
                              hideSplash();
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQUEST);
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) ->
                          openExternal(Uri.parse(url)));
              }

              /** Returns true when the link was handled outside the app. */
              private boolean handleUrl(Uri uri) {
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();

                  if (scheme.equals("http") || scheme.equals("https")) {
                      String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                      if (host.equals(SITE_HOST) || host.endsWith("." + SITE_HOST)) {
                          return false;
                      }
                      for (String h : EXTERNAL_HOSTS) {
                          if (host.equals(h) || host.endsWith("." + h)) {
                              openExternal(uri);
                              return true;
                          }
                      }
                      // Payment pages (JazzCash, EasyPaisa, banks) stay inside the app
                      return false;
                  }

                  if (scheme.equals("intent")) {
                      try {
                          Intent intent = Intent.parseUri(uri.toString(), Intent.URI_INTENT_SCHEME);
                          try {
                              startActivity(intent);
                          } catch (ActivityNotFoundException e) {
                              String fallback = intent.getStringExtra("browser_fallback_url");
                              if (fallback != null) {
                                  web.loadUrl(fallback);
                              }
                          }
                      } catch (Exception ignored) {
                      }
                      return true;
                  }

                  // tel:, mailto:, whatsapp:, sms: and other app links
                  openExternal(uri);
                  return true;
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                  }
              }

              private void showOffline(boolean show) {
                  offline.setVisibility(show ? View.VISIBLE : View.GONE);
                  if (show) {
                      bar.setVisibility(View.GONE);
                      swipe.setRefreshing(false);
                  }
              }

              private void hideSplash() {
                  if (splash == null || splash.getVisibility() != View.VISIBLE) {
                      return;
                  }
                  splash.animate().alpha(0f).setDuration(350)
                          .withEndAction(() -> splash.setVisibility(View.GONE)).start();
              }

              /** Cream screen with the KefirBuy logo, shown while the shop loads. */
              private FrameLayout buildSplashView() {
                  FrameLayout box = new FrameLayout(this);
                  box.setBackgroundColor(CREAM);
                  box.setClickable(true);

                  LinearLayout column = new LinearLayout(this);
                  column.setOrientation(LinearLayout.VERTICAL);
                  column.setGravity(Gravity.CENTER_HORIZONTAL);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_logo);
                  logo.setAdjustViewBounds(true);
                  int width = Math.min(getResources().getDisplayMetrics().widthPixels * 72 / 100, dp(360));
                  column.addView(logo, new LinearLayout.LayoutParams(width, ViewGroup.LayoutParams.WRAP_CONTENT));

                  ProgressBar spinner = new ProgressBar(this);
                  spinner.setIndeterminateTintList(ColorStateList.valueOf(WARM_AMBER));
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(dp(32), dp(32));
                  sp.topMargin = dp(36);
                  column.addView(spinner, sp);

                  box.addView(column, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
                  return box;
              }

              private LinearLayout buildOfflineView() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(CREAM);
                  box.setPadding(dp(32), dp(32), dp(32), dp(32));
                  box.setClickable(true);

                  FrameLayout circle = new FrameLayout(this);
                  GradientDrawable circleBg = new GradientDrawable();
                  circleBg.setShape(GradientDrawable.OVAL);
                  circleBg.setColor(SOFT_SAGE);
                  circle.setBackground(circleBg);
                  ImageView jar = new ImageView(this);
                  jar.setImageResource(R.drawable.offline_jar);
                  jar.setAdjustViewBounds(true);
                  circle.addView(jar, new FrameLayout.LayoutParams(dp(56), dp(80), Gravity.CENTER));
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(dp(120), dp(120));
                  cp.bottomMargin = dp(24);
                  box.addView(circle, cp);

                  TextView title = new TextView(this);
                  title.setText("No internet connection");
                  title.setTextSize(20);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setTextColor(DEEP_SAGE_GREEN);
                  title.setGravity(Gravity.CENTER);
                  box.addView(title);

                  TextView msg = new TextView(this);
                  msg.setText("Please check your internet and try again.");
                  msg.setTextSize(15);
                  msg.setTextColor(MUTED_SLATE);
                  msg.setGravity(Gravity.CENTER);
                  msg.setPadding(0, dp(8), 0, dp(28));
                  box.addView(msg);

                  Button retry = new Button(this);
                  retry.setText("Try again");
                  retry.setAllCaps(false);
                  retry.setTextSize(16);
                  retry.setTypeface(Typeface.DEFAULT_BOLD);
                  retry.setTextColor(Color.WHITE);
                  retry.setStateListAnimator(null);
                  retry.setBackground(amberButtonBackground());
                  retry.setPadding(dp(36), dp(12), dp(36), dp(12));
                  retry.setOnClickListener(v -> {
                      showOffline(false);
                      String url = web.getUrl();
                      if (url == null || url.startsWith("data:") || url.equals("about:blank")) {
                          web.loadUrl(HOME);
                      } else {
                          web.reload();
                      }
                  });
                  box.addView(retry, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return box;
              }

              /** Warm Amber button that turns Amber Hover when pressed. */
              private StateListDrawable amberButtonBackground() {
                  StateListDrawable states = new StateListDrawable();
                  states.addState(new int[]{android.R.attr.state_pressed}, roundedRect(AMBER_HOVER));
                  states.addState(new int[]{}, roundedRect(WARM_AMBER));
                  return states;
              }

              private GradientDrawable roundedRect(int color) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(12));
                  return d;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  if (intent != null && intent.getData() != null) {
                      web.loadUrl(intent.getData().toString());
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      showOffline(false);
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }
          }
          END_OF_FILE_8
          cat > make_icons.py <<'END_OF_FILE_9'
          import base64
          import os

          from PIL import Image, ImageDraw

          SOFT_SAGE = (0xDF, 0xE8, 0xD7)
          RES = "app/src/main/res"
          LEGACY = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          ADAPTIVE = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}


          def load(name):
              # Images are stored as text (.b64) so the whole app fits in one file
              if os.path.exists(name + ".b64"):
                  with open(name + ".b64") as f:
                      data = base64.b64decode(f.read())
                  with open(name, "wb") as f:
                      f.write(data)
              return Image.open(name).convert("RGBA")


          def fit(img, size, scale):
              inner = max(1, int(size * scale))
              copy = img.copy()
              copy.thumbnail((inner, inner), Image.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.paste(copy, ((size - copy.width) // 2, (size - copy.height) // 2), copy)
              return canvas


          def rounded(img, radius_ratio=0.22):
              mask = Image.new("L", img.size, 0)
              ImageDraw.Draw(mask).rounded_rectangle(
                  (0, 0, img.width - 1, img.height - 1), radius=int(img.width * radius_ratio), fill=255)
              out = img.copy()
              out.putalpha(mask)
              return out


          def main():
              jar = load("icon_src.png")
              logo = load("logo_src.png")

              for name, size in LEGACY.items():
                  folder = os.path.join(RES, "mipmap-" + name)
                  os.makedirs(folder, exist_ok=True)
                  base = Image.new("RGBA", (size, size), SOFT_SAGE + (255,))
                  base.alpha_composite(fit(jar, size, 0.78))
                  rounded(base).save(os.path.join(folder, "ic_launcher.png"))

              for name, size in ADAPTIVE.items():
                  folder = os.path.join(RES, "mipmap-" + name)
                  os.makedirs(folder, exist_ok=True)
                  fit(jar, size, 0.6).save(os.path.join(folder, "ic_launcher_foreground.png"))

              drawables = os.path.join(RES, "drawable-nodpi")
              os.makedirs(drawables, exist_ok=True)
              logo.save(os.path.join(drawables, "splash_logo.png"))
              jar.save(os.path.join(drawables, "offline_jar.png"))
              print("Icons, splash logo and offline image created")


          if __name__ == "__main__":
              main()
          END_OF_FILE_9
