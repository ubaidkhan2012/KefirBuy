# KefirBuy Android app (v1.4.0) - GitHub builds the APK from this one file.
# When the run finishes, download KefirBuy.apk from the "Releases" section of this repository.
#
# The app's web code, icons and Android settings are packed in the PAYLOAD block below
# (a base64 .tar.gz). Source: Capacitor 6 wrapper around the KefirBuy shopping app.
#
# Optional, for a permanent signing key (needed for Google Play and for installing updates
# over the old version): add repository secrets KEYSTORE_B64 and KEYSTORE_PASSWORD.
# Without them each build is signed with a fresh temporary key.
name: Build KefirBuy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -5

