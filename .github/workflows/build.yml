          .perk .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--sage); color: var(--green); display: grid; place-items: center; flex: none; }
          .perk .ico svg { width: 19px; height: 19px; }
          .perk b { display: block; font-size: 13px; }
          .perk small { color: var(--muted); font-size: 12px; }
          .desc { color: #334155; font-size: 14px; line-height: 1.65; overflow: hidden; position: relative; }
