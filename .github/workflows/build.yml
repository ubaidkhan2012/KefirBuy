          /* KefirBuy app — brand tokens */
          :root {
            --green: #38593B;
            --green-dark: #2C472F;
            --sage: #DFE8D7;
            --cream: #FDFBF7;
            --amber: #D97706;
            --amber-dark: #B45F04;
            --ink: #1E293B;
            --muted: #64748B;
            --border: #E7E0D3;
            --surface: #FFFFFF;
            --page: #F5F2EC;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 2px rgba(30, 41, 59, .06), 0 4px 14px rgba(30, 41, 59, .06);
            --shadow-up: 0 -4px 18px rgba(30, 41, 59, .08);
            --tabbar-h: 62px;
            --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          }

          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
          html { background: var(--page); }
          body {
            margin: 0;
            font-family: var(--font);
            color: var(--ink);
            background: var(--page);
            font-size: 14px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
            padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
          }
          body.no-tabbar { padding-bottom: 0; }
          a { color: inherit; text-decoration: none; }
          button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
          input { font: inherit; color: inherit; }
          img { display: block; max-width: 100%; }
          .ico svg { width: 22px; height: 22px; display: block; }
          [hidden] { display: none !important; }

          /* ---------- page transition ---------- */
          .page { animation: pageIn .26s cubic-bezier(.2, .8, .2, 1); min-height: 100vh; }
          .page.back { animation-name: pageBack; }
          @keyframes pageIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
          @keyframes pageBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

          /* ---------- headers ---------- */
          .home-head {
            background: linear-gradient(160deg, var(--green) 0%, var(--green-dark) 100%);
            color: #fff;
            padding: 14px 16px 18px;
            border-radius: 0 0 24px 24px;
          }
          .brand-row { display: flex; align-items: center; gap: 10px; }
          .brand-mark {
            width: 38px; height: 38px; border-radius: 12px; background: var(--cream);
            display: grid; place-items: center; flex: none;
          }
          .brand-mark img { width: 22px; }
          .brand-text { flex: 1; min-width: 0; }
          .brand-text b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
          .brand-text small { display: block; font-size: 12px; opacity: .8; }
          .head-btn {
            width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
            background: rgba(255, 255, 255, .14); color: #fff; position: relative;
          }
          .searchbar {
            margin-top: 14px; display: flex; align-items: center; gap: 10px;
            background: #fff; color: var(--muted); border-radius: 14px; padding: 0 6px 0 14px; height: 48px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
          }
          .searchbar .ico svg { width: 20px; height: 20px; }
          .searchbar span.ph { flex: 1; font-size: 14px; }
          .searchbar .go {
            background: var(--amber); color: #fff; font-weight: 700; font-size: 13px;
            padding: 0 16px; height: 36px; border-radius: 10px; display: grid; place-items: center;
          }

          .topbar {
            position: sticky; top: 0; z-index: 20; background: var(--surface);
            display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 58px;
            border-bottom: 1px solid var(--border);
          }
          .topbar h1 { flex: 1; font-size: 17px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .icon-btn {
            width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--ink);
          }
          .icon-btn:active { background: var(--sage); }
          .topbar .search-input {
            flex: 1; height: 42px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--cream);
            padding: 0 14px; outline: none; font-size: 15px;
