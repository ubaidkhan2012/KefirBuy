                '<a href="#" data-wa><span class="ico">' + icon('chat') + '</span><span class="t">Chat on WhatsApp</span><span class="chev">' + icon('chev', 18) + '</span></a>' +
                '<a href="/contact/"><span class="ico">' + icon('mail') + '</span><span class="t">Contact us</span><span class="chev">' + icon('chev', 18) + '</span></a>' +
                '<a href="/"><span class="ico">' + icon('globe') + '</span><span class="t">Open full website</span><span class="chev">' + icon('chev', 18) + '</span></a>' +
                '</div><div class="version">KefirBuy app · version 2.0</div></div>');
              page.querySelector('[data-wa]').onclick = function (e) { e.preventDefault(); openWhatsApp('Assalam o Alaikum KefirBuy!'); };
              return page;
            };

            /* ---------------- router ---------------- */
            var TABS = { home: 'home', categories: 'categories', cart: 'cart', wishlist: 'wishlist', account: 'account' };
            function parse(hash) {
              var parts = (hash || '').replace(/^#\/?/, '').split('/').map(function (s) { try { return decodeURIComponent(s); } catch (e) { return s; } });
              var name = parts[0] || 'home';
              switch (name) {
                case 'categories': return { name: 'categories', arg: null };
                case 'c': return { name: 'category', arg: parts[1] };
                case 'list': return { name: 'list', arg: parts[1] };
                case 'p': return { name: 'product', arg: parts[1] };
                case 'search': return { name: 'search', arg: parts.slice(1).join('/') };
                case 'cart': return { name: 'cart', arg: null };
                case 'wishlist': return { name: 'wishlist', arg: null };
                case 'account': return { name: 'account', arg: null };
                default: return { name: 'home', arg: null };
              }
            }

            function render() {
              var hash = location.hash || '#/';
              var r = parse(hash);
              var goingBack = historyDepth.length > 1 && historyDepth[historyDepth.length - 2] === hash;
              if (goingBack) historyDepth.pop(); else if (historyDepth[historyDepth.length - 1] !== hash) historyDepth.push(hash);

              // remember where we were
              if (current.hash) scrollPos[current.hash] = window.scrollY;
              var old = $view.firstChild;
              if (old) {
                if (old._cleanup) old._cleanup();
                if (current.keep) keep[current.hash] = old;
                $view.removeChild(old);
              }

              var page;
              var reused = false;
              if (keep[hash]) { page = keep[hash]; reused = true; }
              else page = views[r.name](r.arg);
              page.classList.remove('back');
              if (goingBack) page.classList.add('back');
              if (reused) { page.style.animation = 'none'; void page.offsetWidth; page.style.animation = ''; }

              $view.appendChild(page);
              fillIcons(page);
              page.querySelectorAll('[data-back]').forEach(function (b) {
                b.onclick = function () { if (historyDepth.length > 1) history.back(); else go('#/'); };
              });

              current = { name: r.name, hash: hash, keep: !!views[r.name].keep };
              var tab = TABS[r.name] || (r.name === 'category' || r.name === 'list' ? 'categories' : null);
              document.body.classList.toggle('no-tabbar', r.name === 'product' || r.name === 'search');
              document.querySelectorAll('#tabbar a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-tab') === tab); });
              window.scrollTo(0, reused || goingBack ? (scrollPos[hash] || 0) : 0);
              lastHash = hash;
              // keep at most a few cached pages
              var keys = Object.keys(keep);
              if (keys.length > 6) keys.filter(function (k) { return k !== '#/' && k !== hash; }).slice(0, keys.length - 6).forEach(function (k) { delete keep[k]; });
            }

            window.addEventListener('hashchange', render);
            // coming back from checkout / website pages: refresh the cart
            window.addEventListener('pageshow', function (e) { if (e.persisted) { refreshCart(); if (current.name === 'cart') render(); } });
            document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshCart(); });

            fillIcons(document);
            refreshCart();
            render();
          })();
