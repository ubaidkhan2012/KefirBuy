# KefirBuy Android app (v0.9.2) - GitHub builds the app from this one file.
# When the run finishes, download KefirBuy.apk (phones) or KefirBuy.aab (Google Play) from "Releases".
#
# The app's web code, icons and Android settings are packed in the PAYLOAD block below
# (a base64 .tar.gz). Source: Capacitor 8 (targets Android 16 / API 36) around the KefirBuy app.
#
# Permanent signing key (needed so updates install over the old app, and for Google Play):
# add repository secrets KEYSTORE_B64 and KEYSTORE_PASSWORD. Without them each build is
# signed with a fresh temporary key.
name: Build KefirBuy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -6
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

