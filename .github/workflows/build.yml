              <color name="muted_slate">#64748B</color>
              <color name="warm_border">#E7E0D3</color>
              <color name="icon_bg">#DFE8D7</color>

              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:colorPrimary">@color/deep_sage_green</item>
                  <item name="android:colorPrimaryDark">@color/dark_green</item>
                  <item name="android:colorAccent">@color/warm_amber</item>
                  <item name="android:statusBarColor">@color/deep_sage_green</item>
                  <item name="android:navigationBarColor">@color/deep_sage_green</item>
                  <item name="android:windowBackground">@color/cream</item>
