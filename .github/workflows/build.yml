            margin: 0 -16px; padding: 0 16px 6px; scrollbar-width: none;
          }
          .hscroll::-webkit-scrollbar { display: none; }
          .hscroll > * { scroll-snap-align: start; flex: none; }

          /* promo carousel */
          .promos { margin-top: -2px; padding-top: 16px; }
          .promo {
            width: calc(100vw - 48px); max-width: 420px; height: 150px; border-radius: 20px; overflow: hidden;
            position: relative; color: #fff; padding: 18px; display: flex; flex-direction: column; justify-content: center;
          }
          .promo.app { background: radial-gradient(circle at 85% 20%, rgba(217, 119, 6, .55), transparent 55%), linear-gradient(135deg, #2C472F, #38593B 60%, #4a7350); }
          .promo.cod { background: linear-gradient(135deg, #DFE8D7, #f2f6ee); color: var(--green-dark); }
          .promo.img { padding: 0; background: var(--sage); }
