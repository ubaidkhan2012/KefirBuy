          /* category circles */
          .cat-circle { width: 74px; text-align: center; }
          .cat-circle .ph {
            width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 50%; background: var(--sage);
            overflow: hidden; display: grid; place-items: center; font-weight: 800; color: var(--green); font-size: 20px;
            border: 2px solid #fff; box-shadow: var(--shadow);
          }
          .cat-circle .ph img { width: 100%; height: 100%; object-fit: cover; }
          .cat-circle span { font-size: 11.5px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

          /* ---------- product cards ---------- */
          .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
          .card {
            background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
            display: flex; flex-direction: column; position: relative; transition: transform .15s;
          }
