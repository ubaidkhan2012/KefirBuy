          .dots i.on { width: 18px; background: var(--green); }

          /* trust row */
          .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 16px 16px 0; }
          .trust div { background: var(--surface); border-radius: 14px; padding: 10px 4px; text-align: center; box-shadow: var(--shadow); }
          .trust .ico { display: grid; place-items: center; color: var(--green); }
