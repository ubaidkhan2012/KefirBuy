# KefirBuy Android app - GitHub builds the APK from this one file.
# After it finishes, download the APK from the "Releases" section of this repository.
name: Build KefirBuy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the app files
        run: |
          mkdir -p app app/src/main app/src/main/assets/app-shell app/src/main/java/com/kefirbuy/app app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/values-v31
          cat > settings.gradle <<'END_OF_FILE_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KefirBuy"
          include ':app'
          END_OF_FILE_0
          cat > build.gradle <<'END_OF_FILE_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          END_OF_FILE_1
          cat > gradle.properties <<'END_OF_FILE_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          END_OF_FILE_2
          cat > app/build.gradle <<'END_OF_FILE_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kefirbuy.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.kefirbuy.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          END_OF_FILE_3
          cat > app/src/main/AndroidManifest.xml <<'END_OF_FILE_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="KefirBuy"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="kefirbuy.com" />
                          <data android:scheme="https" android:host="www.kefirbuy.com" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_OF_FILE_4
          cat > app/src/main/res/values/styles.xml <<'END_OF_FILE_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- KefirBuy brand palette -->
              <color name="deep_sage_green">#38593B</color>
              <color name="dark_green">#2C472F</color>
              <color name="soft_sage">#DFE8D7</color>
              <color name="cream">#FDFBF7</color>
              <color name="warm_amber">#D97706</color>
              <color name="amber_hover">#B45F04</color>
              <color name="slate_ink">#1E293B</color>
              <color name="muted_slate">#64748B</color>
              <color name="warm_border">#E7E0D3</color>
              <color name="icon_bg">#DFE8D7</color>

              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:colorPrimary">@color/deep_sage_green</item>
                  <item name="android:colorPrimaryDark">@color/dark_green</item>
                  <item name="android:colorAccent">@color/warm_amber</item>
                  <item name="android:statusBarColor">@color/deep_sage_green</item>
                  <item name="android:navigationBarColor">@color/deep_sage_green</item>
                  <item name="android:windowBackground">@color/cream</item>
                  <item name="android:textColor">@color/slate_ink</item>
              </style>
          </resources>
          END_OF_FILE_5
          cat > app/src/main/res/values-v31/styles.xml <<'END_OF_FILE_6'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:colorPrimary">@color/deep_sage_green</item>
                  <item name="android:colorPrimaryDark">@color/dark_green</item>
                  <item name="android:colorAccent">@color/warm_amber</item>
                  <item name="android:statusBarColor">@color/deep_sage_green</item>
                  <item name="android:navigationBarColor">@color/deep_sage_green</item>
                  <item name="android:windowBackground">@color/cream</item>
                  <item name="android:textColor">@color/slate_ink</item>
                  <item name="android:windowSplashScreenBackground">@color/cream</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@color/soft_sage</item>
              </style>
          </resources>
          END_OF_FILE_6
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'END_OF_FILE_7'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          END_OF_FILE_7
          cat > app/src/main/java/com/kefirbuy/app/MainActivity.java <<'END_OF_FILE_8'
          package com.kefirbuy.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {

              // The app screens are packed inside the APK and served as if they were on kefirbuy.com,
              // so the cart, login and checkout are shared with the real website.
              private static final String SHELL_PATH = "/app-shell/";
              private static final String HOME = "https://kefirbuy.com/app-shell/index.html";
              private static final String SITE_HOST = "kefirbuy.com";
              private static final int FILE_REQUEST = 1001;
              private static final long SPLASH_MAX_MS = 8000;

              // KefirBuy brand palette
              private static final int DEEP_SAGE_GREEN = Color.parseColor("#38593B");
              private static final int DARK_GREEN = Color.parseColor("#2C472F");
              private static final int SOFT_SAGE = Color.parseColor("#DFE8D7");
              private static final int CREAM = Color.parseColor("#FDFBF7");
              private static final int WARM_AMBER = Color.parseColor("#D97706");
              private static final int AMBER_HOVER = Color.parseColor("#B45F04");
              private static final int SLATE_INK = Color.parseColor("#1E293B");
              private static final int MUTED_SLATE = Color.parseColor("#64748B");

              // Links to these sites open in their own apps (WhatsApp, Facebook, ...)
              private static final String[] EXTERNAL_HOSTS = {
                      "wa.me", "whatsapp.com", "facebook.com", "fb.com", "fb.me", "m.me",
                      "instagram.com", "youtube.com", "youtu.be", "tiktok.com",
                      "twitter.com", "x.com", "t.me", "linkedin.com", "pinterest.com",
                      "play.google.com", "maps.google.com", "maps.app.goo.gl", "goo.gl"
              };

              private WebView web;
              private SwipeRefreshLayout swipe;
              private ProgressBar bar;
              private LinearLayout offline;
              private FrameLayout splash;
              private LinearLayout topBar;
              private TextView topTitle;
              private WebViewAssetLoader assetLoader;
              private ValueCallback<Uri[]> fileCallback;
              private boolean pageFailed = false;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout outer = new LinearLayout(this);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setBackgroundColor(CREAM);
                  topBar = buildTopBar();
                  topBar.setVisibility(View.GONE);
                  outer.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(56)));

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(CREAM);
                  outer.addView(root, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  swipe = new SwipeRefreshLayout(this);
                  swipe.setColorSchemeColors(DEEP_SAGE_GREEN, WARM_AMBER);
                  swipe.setProgressBackgroundColorSchemeColor(CREAM);
                  web = new WebView(this);
                  web.setBackgroundColor(CREAM);
                  swipe.addView(web, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(swipe, matchParent());

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);
                  bar.setProgressTintList(ColorStateList.valueOf(WARM_AMBER));
                  bar.setProgressBackgroundTintList(ColorStateList.valueOf(SOFT_SAGE));
                  root.addView(bar, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, dp(4), Gravity.TOP));

                  offline = buildOfflineView();
                  offline.setVisibility(View.GONE);
                  root.addView(offline, matchParent());

                  splash = buildSplashView();
                  root.addView(splash, matchParent());

                  setContentView(outer);
                  setupWebView();

                  swipe.setOnChildScrollUpCallback((parent, child) -> web.getScrollY() > 0);
                  swipe.setOnRefreshListener(() -> web.reload());

                  if (savedInstanceState != null) {
                      splash.setVisibility(View.GONE);
                      web.restoreState(savedInstanceState);
                  } else {
                      handler.postDelayed(this::hideSplash, SPLASH_MAX_MS);
                      Uri data = getIntent() != null ? getIntent().getData() : null;
                      web.loadUrl(data != null ? data.toString() : HOME);
                  }
              }

              private FrameLayout.LayoutParams matchParent() {
                  return new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT);
              }

              private void setupWebView() {
                  assetLoader = new WebViewAssetLoader.Builder()
                          .setDomain(SITE_HOST)
                          .addPathHandler(SHELL_PATH, path -> {
                              try {
                                  InputStream in = getAssets().open("app-shell/" + (path.isEmpty() ? "index.html" : path));
                                  return new WebResourceResponse(mimeType(path), "utf-8", in);
                              } catch (IOException e) {
                                  return null;
                              }
                          })
                          .build();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(s.getUserAgentString() + " KefirBuyApp/1.0");

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public void doUpdateVisitedHistory(WebView view, String url, boolean isReload) {
                          updateChrome(url);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          pageFailed = false;
                          updateChrome(url);
                          if (!isShell(url)) {
                              bar.setVisibility(View.VISIBLE);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          bar.setVisibility(View.GONE);
                          swipe.setRefreshing(false);
                          showOffline(pageFailed);
                          hideSplash();
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              pageFailed = true;
                              showOffline(true);
                              hideSplash();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onReceivedTitle(WebView view, String title) {
                          if (topTitle != null && title != null && !title.startsWith("http")) {
                              topTitle.setText(cleanTitle(title));
                          }
                      }

                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          bar.setProgress(progress);
                          bar.setVisibility(progress < 100 && !isShell(view.getUrl()) ? View.VISIBLE : View.GONE);
                          if (progress >= 80) {
                              hideSplash();
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQUEST);
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) ->
                          openExternal(Uri.parse(url)));
              }

              /** Returns true when the link was handled outside the app. */
              private boolean handleUrl(Uri uri) {
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();

                  if (scheme.equals("http") || scheme.equals("https")) {
                      String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                      if (host.equals(SITE_HOST) || host.endsWith("." + SITE_HOST)) {
                          return false;
                      }
                      for (String h : EXTERNAL_HOSTS) {
                          if (host.equals(h) || host.endsWith("." + h)) {
                              openExternal(uri);
                              return true;
                          }
                      }
                      // Payment pages stay inside the app
                      return false;
                  }

                  if (scheme.equals("intent")) {
                      try {
                          Intent intent = Intent.parseUri(uri.toString(), Intent.URI_INTENT_SCHEME);
                          try {
                              startActivity(intent);
                          } catch (ActivityNotFoundException e) {
                              String fallback = intent.getStringExtra("browser_fallback_url");
                              if (fallback != null) {
                                  web.loadUrl(fallback);
                              }
                          }
                      } catch (Exception ignored) {
                      }
                      return true;
                  }

                  // tel:, mailto:, whatsapp:, sms: and other app links
                  openExternal(uri);
                  return true;
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                  }
              }

              private static boolean isShell(String url) {
                  if (url == null) return false;
                  Uri u = Uri.parse(url);
                  return SITE_HOST.equals(u.getHost()) && u.getPath() != null && u.getPath().startsWith(SHELL_PATH);
              }

              private static String mimeType(String path) {
                  if (path.endsWith(".js")) return "application/javascript";
                  if (path.endsWith(".css")) return "text/css";
                  if (path.endsWith(".png")) return "image/png";
                  if (path.endsWith(".svg")) return "image/svg+xml";
                  if (path.endsWith(".json")) return "application/json";
                  return "text/html";
              }

              private static String cleanTitle(String title) {
                  String t = title;
                  int cut = t.lastIndexOf(" - ");
                  if (cut < 0) cut = t.lastIndexOf(" – ");
                  if (cut < 0) cut = t.lastIndexOf(" | ");
                  if (cut > 0) t = t.substring(0, cut);
                  return t.trim();
              }

              /** App screens have their own design; website pages (checkout, account) get a native top bar. */
              private void updateChrome(String url) {
                  boolean shell = isShell(url);
                  topBar.setVisibility(shell ? View.GONE : View.VISIBLE);
                  swipe.setEnabled(!shell);
                  if (shell) {
                      bar.setVisibility(View.GONE);
                  } else if (url != null) {
                      String path = Uri.parse(url).getPath();
                      if (path != null && path.contains("/checkout")) {
                          topTitle.setText(path.contains("order-received") ? "Order placed" : "Checkout");
                      }
                  }
              }

              private void goBackOrHome() {
                  String url = web.getUrl();
                  if (url != null && url.contains("/order-received/")) {
                      goHome();
                      return;
                  }
                  if (web.canGoBack()) {
                      showOffline(false);
                      web.goBack();
                  } else {
                      goHome();
                  }
              }

              private void goHome() {
                  showOffline(false);
                  web.loadUrl(HOME + "#/");
              }

              private LinearLayout buildTopBar() {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setBackgroundColor(Color.WHITE);
                  row.setElevation(dp(2));
                  row.setPadding(dp(4), 0, dp(12), 0);

                  TextView back = new TextView(this);
                  back.setText("\u2190");
                  back.setTextSize(24);
                  back.setTextColor(SLATE_INK);
                  back.setGravity(Gravity.CENTER);
                  back.setOnClickListener(v -> goBackOrHome());
                  row.addView(back, new LinearLayout.LayoutParams(dp(48), dp(48)));

                  topTitle = new TextView(this);
                  topTitle.setText("KefirBuy");
                  topTitle.setTextSize(17);
                  topTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  topTitle.setTextColor(SLATE_INK);
                  topTitle.setSingleLine(true);
                  topTitle.setEllipsize(TextUtils.TruncateAt.END);
                  row.addView(topTitle, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  TextView shop = new TextView(this);
                  shop.setText("Shop");
                  shop.setTextSize(14);
                  shop.setTypeface(Typeface.DEFAULT_BOLD);
                  shop.setTextColor(Color.WHITE);
                  shop.setGravity(Gravity.CENTER);
                  shop.setBackground(roundedRect(DEEP_SAGE_GREEN));
                  shop.setPadding(dp(16), 0, dp(16), 0);
                  shop.setOnClickListener(v -> goHome());
                  row.addView(shop, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(36)));
                  return row;
              }

              private void showOffline(boolean show) {
                  offline.setVisibility(show ? View.VISIBLE : View.GONE);
                  if (show) {
                      bar.setVisibility(View.GONE);
                      swipe.setRefreshing(false);
                  }
              }

              private void hideSplash() {
                  if (splash == null || splash.getVisibility() != View.VISIBLE) {
                      return;
                  }
                  splash.animate().alpha(0f).setDuration(350)
                          .withEndAction(() -> splash.setVisibility(View.GONE)).start();
              }

              /** Cream screen with the KefirBuy logo, shown while the shop loads. */
              private FrameLayout buildSplashView() {
                  FrameLayout box = new FrameLayout(this);
                  box.setBackgroundColor(CREAM);
                  box.setClickable(true);

                  LinearLayout column = new LinearLayout(this);
                  column.setOrientation(LinearLayout.VERTICAL);
                  column.setGravity(Gravity.CENTER_HORIZONTAL);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_logo);
                  logo.setAdjustViewBounds(true);
                  int width = Math.min(getResources().getDisplayMetrics().widthPixels * 72 / 100, dp(360));
                  column.addView(logo, new LinearLayout.LayoutParams(width, ViewGroup.LayoutParams.WRAP_CONTENT));

                  ProgressBar spinner = new ProgressBar(this);
                  spinner.setIndeterminateTintList(ColorStateList.valueOf(WARM_AMBER));
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(dp(32), dp(32));
                  sp.topMargin = dp(36);
                  column.addView(spinner, sp);

                  box.addView(column, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
                  return box;
              }

              private LinearLayout buildOfflineView() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(CREAM);
                  box.setPadding(dp(32), dp(32), dp(32), dp(32));
                  box.setClickable(true);

                  FrameLayout circle = new FrameLayout(this);
                  GradientDrawable circleBg = new GradientDrawable();
                  circleBg.setShape(GradientDrawable.OVAL);
                  circleBg.setColor(SOFT_SAGE);
                  circle.setBackground(circleBg);
                  ImageView jar = new ImageView(this);
                  jar.setImageResource(R.drawable.offline_jar);
                  jar.setAdjustViewBounds(true);
                  circle.addView(jar, new FrameLayout.LayoutParams(dp(56), dp(80), Gravity.CENTER));
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(dp(120), dp(120));
                  cp.bottomMargin = dp(24);
                  box.addView(circle, cp);

                  TextView title = new TextView(this);
                  title.setText("No internet connection");
                  title.setTextSize(20);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setTextColor(DEEP_SAGE_GREEN);
                  title.setGravity(Gravity.CENTER);
                  box.addView(title);

                  TextView msg = new TextView(this);
                  msg.setText("Please check your internet and try again.");
                  msg.setTextSize(15);
                  msg.setTextColor(MUTED_SLATE);
                  msg.setGravity(Gravity.CENTER);
                  msg.setPadding(0, dp(8), 0, dp(28));
                  box.addView(msg);

                  Button retry = new Button(this);
                  retry.setText("Try again");
                  retry.setAllCaps(false);
                  retry.setTextSize(16);
                  retry.setTypeface(Typeface.DEFAULT_BOLD);
                  retry.setTextColor(Color.WHITE);
                  retry.setStateListAnimator(null);
                  retry.setBackground(amberButtonBackground());
                  retry.setPadding(dp(36), dp(12), dp(36), dp(12));
                  retry.setOnClickListener(v -> {
                      showOffline(false);
                      String url = web.getUrl();
                      if (url == null || url.startsWith("data:") || url.equals("about:blank")) {
                          web.loadUrl(HOME);
                      } else {
                          web.reload();
                      }
                  });
                  box.addView(retry, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return box;
              }

              /** Warm Amber button that turns Amber Hover when pressed. */
              private StateListDrawable amberButtonBackground() {
                  StateListDrawable states = new StateListDrawable();
                  states.addState(new int[]{android.R.attr.state_pressed}, roundedRect(AMBER_HOVER));
                  states.addState(new int[]{}, roundedRect(WARM_AMBER));
                  return states;
              }

              private GradientDrawable roundedRect(int color) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(12));
                  return d;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  if (intent != null && intent.getData() != null) {
                      web.loadUrl(intent.getData().toString());
                  }
              }

              @Override
              public void onBackPressed() {
                  String url = web.getUrl();
                  if (!isShell(url) && url != null) {
                      goBackOrHome();
                  } else if (web.canGoBack()) {
                      showOffline(false);
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }
          }
