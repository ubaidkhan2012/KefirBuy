# KefirBuy Android app - GitHub builds the APK from this one file.
# After it finishes, download the APK from the "Releases" section of this repository.
name: Build KefirBuy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the app files
        run: |
          mkdir -p app app/src/main app/src/main/java/com/kefirbuy/app app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/values-v31
          cat > settings.gradle <<'END_OF_FILE_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KefirBuy"
          include ':app'
          END_OF_FILE_0
          cat > build.gradle <<'END_OF_FILE_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          END_OF_FILE_1
          cat > gradle.properties <<'END_OF_FILE_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          END_OF_FILE_2
          cat > app/build.gradle <<'END_OF_FILE_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kefirbuy.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.kefirbuy.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          END_OF_FILE_3
          cat > app/src/main/AndroidManifest.xml <<'END_OF_FILE_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="KefirBuy"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="kefirbuy.com" />
                          <data android:scheme="https" android:host="www.kefirbuy.com" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_OF_FILE_4
          cat > app/src/main/res/values/styles.xml <<'END_OF_FILE_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- KefirBuy brand palette -->
              <color name="deep_sage_green">#38593B</color>
              <color name="dark_green">#2C472F</color>
              <color name="soft_sage">#DFE8D7</color>
              <color name="cream">#FDFBF7</color>
              <color name="warm_amber">#D97706</color>
