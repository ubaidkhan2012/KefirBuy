            views.search = function (q) {
              q = q || '';
              var page = el('<div class="page"><div class="topbar"><button class="icon-btn" data-back>' + icon('back') + '</button>' +
                '<form style="flex:1;display:flex"><input class="search-input" type="search" enterkeyhint="search" placeholder="Search products" value="' + esc(q) + '"></form></div><div class="body"></div></div>');
              var input = page.querySelector('input');
              var body = page.querySelector('.body');
              page.querySelector('form').onsubmit = function (e) {
                e.preventDefault();
                var v = input.value.trim();
                if (!v) return;
                recent = [v].concat(recent.filter(function (r) { return r.toLowerCase() !== v.toLowerCase(); })).slice(0, 8);
                store('kb_recent', recent);
                input.blur();
                history.replaceState(null, '', '#/search/' + encodeURIComponent(v));
                current.hash = location.hash;
                results(v);
              };
              function results(v) {
                body.innerHTML = '<div class="result-info">Results for “' + esc(v) + '”</div><div class="list-pad"></div>';
                infiniteGrid(body.querySelector('.list-pad'), 'search=' + encodeURIComponent(v));
              }
              function suggestions() {
                var html = '';
                if (recent.length) {
                  html += '<div class="recent"><h4>Recent searches <button data-clear>Clear</button></h4><div class="tagset">' +
                    recent.map(function (r) { return '<a class="tag" href="#/search/' + encodeURIComponent(r) + '">' + esc(r) + '</a>'; }).join('') + '</div></div>';
                }
                html += '<div class="recent"><h4>Popular</h4><div class="tagset">' +
                  ['Milk kefir grains', 'Water kefir', 'Kombucha', 'SCOBY', 'Greek yogurt', 'Starter kit', 'Kimchi'].map(function (r) {
                    return '<a class="tag" href="#/search/' + encodeURIComponent(r) + '">' + r + '</a>';
                  }).join('') + '</div></div>';
                body.innerHTML = html;
                var clr = body.querySelector('[data-clear]');
                if (clr) clr.onclick = function () { recent = []; store('kb_recent', recent); suggestions(); };
              }
              if (q) results(q); else { suggestions(); setTimeout(function () { input.focus(); }, 280); }
              return page;
            };

            views.product = function (id) {
              var page = el('<div class="page pp"><div class="pp-top"><button class="round-btn" data-back>' + icon('back') + '</button>' +
                '<div class="group"><button class="round-btn" data-share>' + icon('share') + '</button><button class="round-btn" data-wishp>' + icon('heart') + '</button><a class="round-btn" href="#/cart">' + icon('cart') + '</a></div></div>' +
                '<div class="gallery"><div class="skel" style="width:100vw;aspect-ratio:1/1;border-radius:0"></div></div>' +
                '<div class="pp-card"><div class="skel" style="height:30px;width:50%"></div><div class="skel" style="height:22px;margin-top:12px"></div><div class="skel" style="height:22px;width:70%;margin-top:8px"></div></div></div>');
              var top = page.querySelector('.pp-top');
              var onScroll = function () { top.classList.toggle('solid', window.scrollY > window.innerWidth - 80); };
              window.addEventListener('scroll', onScroll, { passive: true });
              page._cleanup = function () { window.removeEventListener('scroll', onScroll); };

              var cached = productIndex[id];
              var p0 = api('/products/' + encodeURIComponent(id));
              p0.then(function (p) { build(p); }).catch(function (err) {
                if (cached) { build(cached); return; }
                page.querySelector('.gallery').innerHTML = '';
                page.querySelector('.pp-card').innerHTML = '';
                page.querySelector('.pp-card').appendChild(errorBox(err.message, function () { render(); }));
              });

              function build(p) {
                productIndex[p.id] = p;
                var selected = {};
                var qty = 1;
                var variationId = null;
                var varPrices = null;
                var attrs = (p.attributes || []).filter(function (a) { return a.has_variations; });
                var needsChoice = p.type === 'variable' && attrs.length > 0;

                // gallery
                var imgs = (p.images || []).length ? p.images : [{ src: 'icon.png' }];
                var gal = page.querySelector('.gallery');
                gal.innerHTML = '<div class="track">' + imgs.map(function (im, i) {
                  return '<img ' + (i ? 'loading="lazy" ' : '') + 'src="' + esc(im.src) + '"' + (im.srcset ? ' srcset="' + esc(im.srcset) + '" sizes="100vw"' : '') + ' alt="">';
                }).join('') + '</div>' + (imgs.length > 1 ? '<span class="count">1/' + imgs.length + '</span>' : '');
                var trackEl = gal.querySelector('.track');
                var countEl = gal.querySelector('.count');
                if (countEl) trackEl.addEventListener('scroll', function () {
                  countEl.textContent = (Math.round(trackEl.scrollLeft / trackEl.clientWidth) + 1) + '/' + imgs.length;
                }, { passive: true });

                var card = page.querySelector('.pp-card');
                var rating = parseFloat(p.average_rating || 0);
                card.innerHTML =
                  '<div class="pp-price" id="ppPrice"></div>' +
                  '<h1 class="pp-title">' + text(p.name) + '</h1>' +
                  '<div class="pp-sub">' + (rating > 0 ? '<span class="stars">' + icon('star', 13) + rating.toFixed(1) + ' <span>(' + (p.review_count || 0) + ' reviews)</span></span>' : '') +
                  (p.is_in_stock === false ? '<span class="out-stock">Out of stock</span>' : '<span class="in-stock">In stock</span>') + '</div>' +
                  '<div class="app-offer"><div class="pct">✓</div><div><b>Order directly from KefirBuy</b><small>Current product prices and availability come from our store.</small></div></div>';

                function renderPrice() {
                  var pr = varPrices || p.prices || {};
                  var html;
                  if (needsChoice && !variationId && pr.price_range) {
                    html = '<span class="price">' + esc(money(pr, pr.price_range.min_amount)) + (pr.price_range.max_amount !== pr.price_range.min_amount ? ' – ' + esc(money(pr, pr.price_range.max_amount)) : '') + '</span>';
                  } else {
                    var reg = parseInt(pr.regular_price, 10), cur = parseInt(pr.price, 10);
                    var off = reg > cur ? Math.round((1 - cur / reg) * 100) : 0;
                    html = '<span class="price">' + esc(money(pr, pr.price)) + '</span>' + (off ? '<span class="was">' + esc(money(pr, pr.regular_price)) + '</span><span class="off">-' + off + '%</span>' : '');
                  }
                  card.querySelector('#ppPrice').innerHTML = html;
                }
                renderPrice();

                // options + quantity
                var optBlock = el('<div class="block"></div>');
                if (needsChoice) {
                  attrs.forEach(function (a) {
                    var g = el('<div class="opt-group"><label>' + text(a.name) + ': <b data-sel></b></label><div class="opts"></div></div>');
                    (a.terms || []).forEach(function (t) {
                      var b = el('<button class="opt">' + text(t.name) + '</button>');
                      b.onclick = function () {
                        selected[a.name] = t;
                        g.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('on'); });
                        b.classList.add('on');
                        g.querySelector('[data-sel]').textContent = decode(t.name);
                        matchVariation();
                      };
                      g.querySelector('.opts').appendChild(b);
                    });
                    optBlock.appendChild(g);
                  });
                }
                var qtyRow = el('<div class="qty-row"><b>Quantity</b><div class="qty"><button data-m aria-label="Less">' + icon('minus', 18) + '</button><span>1</span><button data-p aria-label="More">' + icon('plus', 18) + '</button></div></div>');
                var maxQ = (p.add_to_cart && p.add_to_cart.maximum) || 99;
                function setQty(n) {
                  qty = Math.max(1, Math.min(maxQ, n));
                  qtyRow.querySelector('span').textContent = qty;
                  qtyRow.querySelector('[data-m]').disabled = qty <= 1;
                }
                qtyRow.querySelector('[data-m]').onclick = function () { setQty(qty - 1); };
                qtyRow.querySelector('[data-p]').onclick = function () { setQty(qty + 1); };
                setQty(1);
                optBlock.appendChild(qtyRow);
                page.appendChild(optBlock);

                function attrKey(name) { return String(name || '').toLowerCase().replace(/^pa_/, '').replace(/^attribute_/, ''); }
                function matchVariation() {
                  variationId = null; varPrices = null;
                  if (Object.keys(selected).length < attrs.length) { renderPrice(); return; }
                  var found = (p.variations || []).filter(function (v) {
                    return (v.attributes || []).every(function (va) {
                      var chosen = null;
                      attrs.forEach(function (a) {
                        if (selected[a.name] && (attrKey(a.name) === attrKey(va.name) || (a.taxonomy && attrKey(a.taxonomy) === attrKey(va.name)))) chosen = selected[a.name];
                      });
                      if (!chosen) return true;
                      return !va.value || va.value === chosen.slug || decode(va.value).toLowerCase() === decode(chosen.name).toLowerCase();
                    });
                  })[0];
                  if (found) {
                    variationId = found.id;
                    api('/products/' + found.id).then(function (v) {
                      if (variationId !== found.id) return;
                      varPrices = v.prices;
                      renderPrice();
                      if (v.images && v.images.length && v.images[0].src) {
                        var first = trackEl.querySelector('img');
                        if (first) { first.removeAttribute('srcset'); first.src = v.images[0].src; trackEl.scrollTo({ left: 0, behavior: 'smooth' }); }
                      }
                    }).catch(function () { renderPrice(); });
                  } else {
                    toast('This combination is not available');
                    renderPrice();
                  }
                }

                // perks
                page.appendChild(el('<div class="block"><div class="perks">' +
                  '<div class="perk"><span class="ico">' + icon('truck') + '</span><div><b>Delivery all over Pakistan</b><small>Packed fresh and shipped fast</small></div></div>' +
                  '<div class="perk"><span class="ico">' + icon('cash') + '</span><div><b>Cash on delivery available</b><small>Choose from the payment methods available at checkout</small></div></div>' +
                  '<div class="perk"><span class="ico">' + icon('shield') + '</span><div><b>Live culture guarantee</b><small>Questions? Our team is on WhatsApp</small></div></div>' +
                  '</div></div>'));

                // description
                var raw = p.description || p.short_description || '';
                if (raw.replace(/<[^>]*>/g, '').trim()) {
                  var d = el('<div class="block"><h3>Product details</h3><div class="desc"></div></div>');
                  var doc = new DOMParser().parseFromString(raw, 'text/html');
                  doc.querySelectorAll('script,style,iframe,object,embed,form').forEach(function (n) { n.remove(); });
                  doc.querySelectorAll('*').forEach(function (n) {
                    Array.prototype.slice.call(n.attributes).forEach(function (at) {
                      if (/^on/i.test(at.name) || (/^(href|src)$/i.test(at.name) && /^\s*javascript:/i.test(at.value))) n.removeAttribute(at.name);
                    });
                    if (n.tagName === 'IMG') { n.setAttribute('loading', 'lazy'); n.removeAttribute('width'); n.removeAttribute('height'); }
                  });
                  var descEl = d.querySelector('.desc');
                  descEl.innerHTML = doc.body.innerHTML;
                  page.appendChild(d);
                  requestAnimationFrame(function () {
                    if (descEl.scrollHeight > 220) {
                      descEl.classList.add('clamp');
                      var more = el('<button class="link-btn">Show more</button>');
                      more.onclick = function () { descEl.classList.toggle('clamp'); more.textContent = descEl.classList.contains('clamp') ? 'Show more' : 'Show less'; };
                      d.appendChild(more);
                    }
                  });
                }

                // related
                var catId = p.categories && p.categories[0] && p.categories[0].id;
                if (catId) {
                  var rel = el('<div class="block"><h3>You may also like</h3><div class="grid"></div></div>');
                  page.appendChild(rel);
                  api('/products?category=' + catId + '&per_page=7').then(function (list) {
                    list = remember(list).filter(function (x) { return x.id !== p.id; }).slice(0, 6);
                    if (!list.length) { rel.remove(); return; }
                    rel.querySelector('.grid').innerHTML = list.map(function (x) { return cardHTML(x); }).join('');
                  }).catch(function () { rel.remove(); });
                }

                // top buttons
                var wb = page.querySelector('[data-wishp]');
                function paintWish() { var on = isWished(p.id); wb.classList.toggle('on', on); wb.innerHTML = icon(on ? 'heartFill' : 'heart'); }
                paintWish();
                wb.onclick = function () { toggleWish(p); paintWish(); };
                page.querySelector('[data-share]').onclick = function () {
                  var url = p.permalink || ('https://kefirbuy.com/?p=' + p.id);
                  if (navigator.share) navigator.share({ title: decode(p.name), url: url }).catch(function () { });
                  else openWhatsApp(decode(p.name) + ' ' + url);
                };

                // bottom bar
                var bar = el('<div class="pp-bar"><button class="chat">' + icon('chat') + 'Chat</button><button class="btn secondary" data-addc>Add to cart</button><button class="btn primary" data-buy>Buy now</button></div>');
                page.appendChild(bar);
                bar.querySelector('.chat').onclick = function () { openWhatsApp('Assalam o Alaikum, I have a question about: ' + decode(p.name)); };
                function doAdd(then) {
                  if (p.is_in_stock === false) { toast('Sorry, this item is out of stock'); return; }
                  if (needsChoice && !variationId) {
                    toast('Please choose ' + attrs.filter(function (a) { return !selected[a.name]; }).map(function (a) { return decode(a.name); }).join(' & '));
                    optBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                  }
                  var variation = needsChoice ? attrs.map(function (a) {
                    var t = selected[a.name];
                    return a.taxonomy ? { attribute: a.taxonomy, value: t.slug } : { attribute: decode(a.name), value: decode(t.name) };
                  }) : null;
                  var buttons = bar.querySelectorAll('.btn');
                  buttons.forEach(function (b) { b.disabled = true; });
                  addToCart(needsChoice ? variationId : p.id, qty, variation).then(function () {
                    then();
                  }).catch(function (err) { toast(err.message); }).then(function () { buttons.forEach(function (b) { b.disabled = false; }); });
                }
                bar.querySelector('[data-addc]').onclick = function () { doAdd(function () { toast('Added to cart'); }); };
                bar.querySelector('[data-buy]').onclick = function () { doAdd(function () { openSite('/checkout/'); }); };
              }
              return page;
            };

            views.cart = function () {
              var page = el('<div class="page cart"><div class="topbar"><h1>My cart</h1></div><div class="list-pad">' +
                '<div class="skel" style="height:108px;margin-bottom:10px"></div><div class="skel" style="height:108px"></div></div></div>');
              var pad = page.querySelector('.list-pad');
              function draw(c) {
                setCart(c);
                pad.innerHTML = '';
                var old = page.querySelector('.checkout-bar');
                if (old) old.remove();
                if (!c || !c.items || !c.items.length) {
                  pad.innerHTML = '<div class="empty"><div class="art"><img src="icon.png" alt=""></div><h3>Your cart is empty</h3><p>Fresh kefir grains and probiotic goodies are waiting for you.</p><a class="btn primary" href="#/">Start shopping</a></div>';
                  page.querySelector('h1').textContent = 'My cart';
                  return;
                }
                page.querySelector('h1').textContent = 'My cart (' + c.items_count + ')';
                var t = c.totals || {};
                c.items.forEach(function (it) {
                  var pr = it.prices || {};
                  var tot = it.totals || {};
                  var vars = (it.variation || []).map(function (v) { return decode(v.attribute) + ': ' + decode(v.value); }).join(' · ');
                  var row = el('<div class="cart-item"><a class="thumb" href="#/p/' + it.id + '"><img src="' + esc(imgSrc(it)) + '" alt=""></a><div class="info">' +
                    '<a class="name" href="#/p/' + it.id + '">' + text(it.name) + '</a>' + (vars ? '<div class="var">' + esc(vars) + '</div>' : '') +
                    '<span class="price">' + esc(money(tot.currency_code ? tot : t, tot.line_total != null ? (parseInt(tot.line_total, 10) + parseInt(tot.line_total_tax || 0, 10)) : pr.price)) + '</span>' +
                    '<div class="row"><div class="qty"><button data-m>' + icon('minus', 16) + '</button><span>' + it.quantity + '</span><button data-p>' + icon('plus', 16) + '</button></div>' +
                    '<button class="remove" aria-label="Remove">' + icon('trash', 20) + '</button></div></div></div>');
                  var lock = function (on) { row.querySelectorAll('button').forEach(function (b) { b.disabled = on; }); row.style.opacity = on ? .6 : 1; };
                  var update = function (q) {
                    lock(true);
                    var path = q > 0 ? '/cart/update-item' : '/cart/remove-item';
                    var body = q > 0 ? { key: it.key, quantity: q } : { key: it.key };
                    (nonce ? Promise.resolve() : refreshCart()).then(function () {
                      return api(path, { method: 'POST', body: body });
                    }).then(draw).catch(function (err) { toast(err.message); lock(false); });
                  };
                  row.querySelector('[data-m]').onclick = function () { update(it.quantity - 1); };
                  row.querySelector('[data-p]').onclick = function () { update(it.quantity + 1); };
                  row.querySelector('.remove').onclick = function () { update(0); };
                  pad.appendChild(row);
                });

                var cur = t;
                var subtotal = parseInt(t.total_items, 10) + parseInt(t.total_items_tax || 0, 10);
                var discount = parseInt(t.total_discount, 10) + parseInt(t.total_discount_tax || 0, 10);
                var shipping = t.total_shipping != null ? parseInt(t.total_shipping, 10) + parseInt(t.total_shipping_tax || 0, 10) : null;
                var fees = parseInt(t.total_fees || 0, 10) + parseInt(t.total_fees_tax || 0, 10);
                var appSave = Math.min(toNumber(cur, subtotal) * APP_EXTRA_PCT / 100, APP_EXTRA_MAX);

                var sum = el('<div class="summary">' +
                  '<div class="line"><span>Subtotal</span><span>' + esc(money(cur, subtotal)) + '</span></div>' +
                  (discount > 0 ? '<div class="line save"><span>Coupon discount</span><span>−' + esc(money(cur, discount)) + '</span></div>' : '') +
                  (fees ? '<div class="line"><span>Fees &amp; discounts</span><span>' + esc(money(cur, fees)) + '</span></div>' : '') +
                  '<div class="line"><span>Shipping</span><span>' + (shipping ? esc(money(cur, shipping)) : 'At checkout') + '</span></div>' +
                  '<div class="line total"><span>Total</span><span>' + esc(money(cur, t.total_price)) + '</span></div>' +
                  '<form class="coupon"><input placeholder="Coupon code" autocapitalize="characters"><button class="btn green">Apply</button></form>' +
                  ((c.coupons || []).length ? '<div class="tagset" style="margin-top:10px">' + c.coupons.map(function (cp) { return '<button class="tag" data-coupon="' + esc(cp.code) + '">' + esc(cp.code.toUpperCase()) + ' ✕</button>'; }).join('') + '</div>' : '') +
                  '</div>');
                pad.appendChild(sum);
                pad.appendChild(el('<div class="app-offer"><div class="pct">✓</div><div><b>Choose your payment method</b><small>Continue to checkout to see the payment options available for your order.</small></div></div>'));

                sum.querySelector('form').onsubmit = function (e) {
                  e.preventDefault();
                  var code = sum.querySelector('input').value.trim();
                  if (!code) return;
                  api('/cart/apply-coupon', { method: 'POST', body: { code: code } }).then(function (nc) { toast('Coupon applied'); draw(nc); }).catch(function (err) { toast(err.message); });
                };
                sum.querySelectorAll('[data-coupon]').forEach(function (b) {
                  b.onclick = function () {
                    api('/cart/remove-coupon', { method: 'POST', body: { code: b.getAttribute('data-coupon') } }).then(draw).catch(function (err) { toast(err.message); });
                  };
                });

                var bar = el('<div class="checkout-bar"><div class="t"><small>Total</small><b>' + esc(money(cur, t.total_price)) + '</b></div><button class="btn primary">Checkout</button></div>');
                bar.querySelector('button').onclick = function () { openSite('/checkout/'); };
                page.appendChild(bar);
              }
              refreshCart().then(function (c) {
                if (c) draw(c);
                else { pad.innerHTML = ''; pad.appendChild(errorBox('', function () { render(); })); }
              });
              return page;
