      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make the app icon and loading screen logo
        run: |
          pip install pillow
          python make_icons.py

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk KefirBuy.apk

      - name: Save APK in the Actions tab
        uses: actions/upload-artifact@v4
        with:
          name: KefirBuy-APK
          path: KefirBuy.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KefirBuy App (build ${{ github.run_number }})
          body: Download KefirBuy.apk below and open it on your Android phone to install.
          files: KefirBuy.apk
